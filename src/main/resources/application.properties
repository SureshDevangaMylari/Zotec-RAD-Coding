# Shared across all profiles. Operator credentials / desk IDs live in application-{profile}.properties.

# Spring AI — used by wl.ai.rag.rag_spring.RagAlphaSpringService for embeddings.
# Self-hosted OpenAI-compatible stack: set base URL and model to match wl.ai.LLMService.
spring.ai.openai.api-key=${OPENAI_API_KEY:dummy}
spring.ai.openai.base-url=http://10.1.242.250:8000/v1
spring.ai.openai.embedding.options.model=Qwen/Qwen3-Embedding-0.6B

# Web UI on localhost:8080 (Start/Stop Agent + client checkboxes). Bot still uses outbound document APIs.
spring.main.web-application-type=servlet
server.port=8080

# Document processor — upload + review poll
# Upload: multipart file (PDF/text) + form_data JSON (well + client_location)
# Auth: x-bot-secret + x-desktop-id (same as bot.poll.*)
document.upload.url=http://10.1.240.245:8000/upload
document.api-key=02ed3a18bf4cb0a295662e805a7219bedb957c0e99af109024416c84235acad4
document.review.base-url=http://10.1.240.245:8000
document.review.poll-interval-seconds=5
batch.resume.timeout-minutes=60

# Document API login URL (username/password are per profile)
document.auth.login-url=http://10.1.240.245:8000/auth/login

# Hospital review UI (Playwright): open once, sign in with document.auth.*, Submit review per chart
document.review.ui-url=http://10.1.240.245:8080/

# Start bot only when UI Start Agent is clicked (set true to auto-start with all AllowedClients)
flow.auto-start=false
flow.agent-id=698ae5c9b0bf82d7668c29c8

# Desk poll URL (desktop-id / secret are per profile)
bot.poll.url=http://10.1.240.245:8000/bot/poll

# Zotec portal URL (username/password are per profile)
zotec.portal.URL=https://radcoding.zotecpartners.com/

# Static Bearer token for /auth/login, /upload, /review, GET/DELETE /documents — Authorization: Bearer
bearer.token=e9a8fb5e22ed9f71c18e09d1ac3eec9e

# Chrome profile for bot launch (extensions stay). Close Chrome first.
# Windows: uses real User Data via CDP
# Linux: syncs ~/.config/google-chrome → ~/.config/zotec-agent-chrome then CDP
# Needs DISPLAY on Ubuntu (GUI/VNC). Optional: sudo apt-get install -y rsync
zotec.chrome.user-data-dir=
zotec.chrome.profile-directory=Default
zotec.chrome.debugging-port=9222
zotec.chrome.executable=

# Active profile (credentials + desk id from application-{profile}.properties)
#spring.profiles.active=sravani
spring.profiles.active=mareena
#spring.profiles.active=shiva
